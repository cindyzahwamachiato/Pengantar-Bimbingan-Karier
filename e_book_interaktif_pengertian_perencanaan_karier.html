                    opt.classList.remove('border-emerald-500', 'bg-emerald-50', 'dark:bg-emerald-950/40', 'border-rose-500', 'bg-rose-50', 'dark:bg-rose-950/40');
                    if (oIdx === correct) {
                        opt.classList.add('border-emerald-500', 'bg-emerald-50', 'dark:bg-emerald-950/40');
                    } else if (userAns === oIdx && userAns !== correct) {
                        opt.classList.add('border-rose-500', 'bg-rose-50', 'dark:bg-rose-950/40');
                    }
                });

                if (userAns === correct) score++;
            });

            const resultEl = document.getElementById('quiz-result');
            resultEl.textContent = `Skor Kamu: ${score} / ${items.length} Benar!`;
            showToast(`Hasil kuis diperbarui: ${score} dari ${items.length} benar.`);
        };

        // Interaktivitas Bab 4: Salin Kanvas Karier
        window.copyCareerPlan = function() {
            const strength = document.getElementById('plan-strength').value.trim() || '-';
            const role = document.getElementById('plan-role').value.trim() || '-';
            const goal = document.getElementById('plan-goal').value.trim() || '-';
            const skill = document.getElementById('plan-skill').value.trim() || '-';

            const summary = `=== KANVAS RENCANA KARIER PRIBADI ===\n1. Minat & Kekuatan Utama: ${strength}\n2. Bidang/Peran Karier Diminati: ${role}\n3. Target Jangka Pendek (6-12 Bulan): ${goal}\n4. Keterampilan yang Perlu Dipelajari: ${skill}\n====================================`;

            const tempTextarea = document.createElement('textarea');
            tempTextarea.value = summary;
            document.body.appendChild(tempTextarea);
            tempTextarea.select();
            try {
                document.execCommand('copy');
                showToast('Rencana karier berhasil disalin ke clipboard!');
            } catch (err) {
                showToast('Gagal menyalin teks.');
            }
            document.body.removeChild(tempTextarea);
        };

        window.clearCareerPlan = function() {
            ['plan-strength', 'plan-role', 'plan-goal', 'plan-skill'].forEach(id => {
                document.getElementById(id).value = '';
            });
            showToast('Formulir rencana karier telah dikosongkan.');
        };

        // Toast Helper
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Toggle Ukuran Font
        const fontSizeBtn = document.getElementById('font-size-btn');
        function applyFontSize() {
            const textBlocks = document.querySelectorAll('.book-text p, .book-text li');
            textBlocks.forEach(el => {
                if (isLargeFont) {
                    el.classList.add('text-base', 'sm:text-lg');
                } else {
                    el.classList.remove('text-base', 'sm:text-lg');
                }
            });
        }

        fontSizeBtn.addEventListener('click', () => {
            isLargeFont = !isLargeFont;
            applyFontSize();
            showToast(isLargeFont ? 'Ukuran teks diperbesar' : 'Ukuran teks normal');
        });

        // Dark Mode Toggle
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // Mobile Sidebar Controls
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const closeSidebarBtn = document.getElementById('close-sidebar-btn');

        function openMobileSidebar() {
            sidebar.classList.remove('-translate-x-full');
            sidebarOverlay.classList.remove('hidden');
        }

        function closeMobileSidebar() {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        }

        mobileMenuBtn.addEventListener('click', openMobileSidebar);
        closeSidebarBtn.addEventListener('click', closeMobileSidebar);
        sidebarOverlay.addEventListener('click', closeMobileSidebar);

        // Inisialisasi Awal
        window.addEventListener('DOMContentLoaded', () => {
            renderChapter();
        });
    </script>
</body>
</html>
